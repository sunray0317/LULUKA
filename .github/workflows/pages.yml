name: Deploy reviewed public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public allowlist
        run: python3 scripts/build_public.py
      - name: Validate public pages
        run: python3 scripts/check_public.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Actions is the Pages source
        env:
          PAGES_CONFIG_TOKEN: ${{ github.token }}
          PAGES_CONFIG_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          url = 'https://api.github.com/repos/' + os.environ['PAGES_CONFIG_REPOSITORY'] + '/pages'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['PAGES_CONFIG_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'LULUKA-pages'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  source = json.load(response).get('build_type')
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Pages source check failed (HTTP {error.code})')
          if source != 'workflow':
              raise SystemExit('Select GitHub Actions in Settings > Pages, then rerun this workflow; automatic source updates require unavailable administrator permission')
          print('Pages source is GitHub Actions')
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
